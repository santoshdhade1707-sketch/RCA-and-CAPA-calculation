function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

function formatDate(d) {
  if (!d) return '—';
  const dt = new Date(d + 'T00:00:00');
  if (isNaN(dt.getTime())) return d;
  return dt.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
}

function formatDateTime(iso) {
  if (!iso) return '—';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return iso;
  return dt.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) +
    ', ' + dt.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
}

function blankCase(seq) {
  const now = new Date();
  return {
    id: 'c_' + now.getTime() + '_' + Math.random().toString(36).slice(2, 7),
    caseNumber: `ESC-${now.getFullYear()}-${String(seq).padStart(4, '0')}`,

    },

      verificationPlan: '',
      verificationDate: '',
      verified: false,
    },
    aiNarrative: '',
    complianceReference: '',
    additionalNotes: '',
  };
}

function tokenize(str) {
  return (str || '')
    .toLowerCase()
    .replace(/[^a-z0-9\s]/g, ' ')
    .split(/\s+/)
    .filter((w) => w.length > 2 && !STOPWORDS.has(w));
}

function jaccard(aArr, bArr) {
  const a = new Set(aArr);
  const b = new Set(bArr);
  if (a.size === 0 || b.size === 0) return 0;
  let inter = 0;
  a.forEach((w) => { if (b.has(w)) inter += 1; });
  const union = new Set([...a, ...b]).size;
  return union === 0 ? 0 : inter / union;
}

function findMatches(draft, allCases) {
  const draftTokens = tokenize(draft.description);
  return allCases
    .filter((c) => c.id !== draft.id)
    .map((c) => {
      let score = jaccard(draftTokens, tokenize(c.description));
      if (c.category === draft.category) score += 0.1;
      if (c.rca && draft.rca && c.rca.processStepFailed === draft.rca.processStepFailed) score += 0.2;
      return { caseObj: c, score };
    })
    .filter((r) => r.score > 0.18)
    .sort((a, b) => b.score - a.score)
    .slice(0, 5);
}

function scoreReference(entry, queryTokens) {
  const entryTokens = tokenize(entry.keywords);
  return jaccard(queryTokens, entryTokens);
}

// Picks the single most relevant industry/regulatory reference for this case: an exact
// process-step or root-cause-category match wins outright, otherwise falls back to
// keyword overlap against the description/whys. Returns null rather than guessing when
// nothing is clearly relevant — better no citation than a wrong one.
function pickReference(draft, whys) {
  const processStep = (draft.rca && draft.rca.processStepFailed) || '';
  const category = (draft.rca && draft.rca.missReasonCategory) || '';
  const direct = REFERENCE_LIBRARY.find(
    (e) => e.appliesToSteps.includes(processStep) || e.appliesToCategories.includes(category)
  );
  if (direct) return direct;
  const queryTokens = tokenize([category, processStep, draft.description, ...whys].join(' '));
  const scored = REFERENCE_LIBRARY
    .map((entry) => ({ entry, score: scoreReference(entry, queryTokens) }))
    .sort((a, b) => b.score - a.score);
  return scored[0] && scored[0].score > 0 ? scored[0].entry : null;
}

function scoreFewShot(entry, queryTokens) {
  const entryTokens = tokenize([entry.issueType, entry.description, ...entry.whys].join(' '));
  return jaccard(queryTokens, entryTokens);
}

// Picks the n most relevant historical examples for this case's category/whys, padding
// with a diverse default set so there's always style grounding even for a novel issue type.
function pickFewShot(category, whys, description, n = 3) {
  const queryTokens = tokenize([category, description, ...whys].join(' '));
  const scored = FEWSHOT_LIBRARY
    .map((entry) => ({ entry, score: scoreFewShot(entry, queryTokens) }))
    .sort((a, b) => b.score - a.score);
  const top = scored.filter((s) => s.score > 0).slice(0, n).map((s) => s.entry);
  if (top.length < n) {
    for (const entry of FEWSHOT_LIBRARY) {
      if (top.length >= n) break;
      if (!top.includes(entry)) top.push(entry);
    }
  }
  return top;
}

// Deterministically formats the AI's structured output into the register's exact house
// style, so the final narrative is never at the mercy of the model's own formatting.
function composeNarrative({ escalationSummary, rootCause, contributingFactors, correctiveActions, preventiveActions, reference }) {
  const blocks = [];
  if (escalationSummary) blocks.push(['Escalation:', escalationSummary].join('\n'));
  if (rootCause) blocks.push(['Root Cause:', rootCause.trim()].join('\n'));
  const factors = (contributingFactors || []).map((f) => (f || '').trim()).filter(Boolean);
  if (factors.length) blocks.push(['Contributing Factors:', ...factors].join('\n'));
  const ca = (correctiveActions || []).map((a) => (a || '').trim()).filter(Boolean);
  if (ca.length) blocks.push(['Corrective Action (CA):', ...ca].join('\n'));
  const pa = (preventiveActions || []).map((a) => (a || '').trim()).filter(Boolean);
  if (pa.length) blocks.push(['Preventive Action (PA):', ...pa].join('\n'));
  if (reference) {
    blocks.push(['Applicable Standard / Reference:', `${reference.title} — ${reference.citation}.`, reference.note].join('\n'));
  }
  return blocks.join('\n\n');
}

function capitalize(s) {
  const t = (s || '').trim();
  return t ? t.charAt(0).toUpperCase() + t.slice(1) : t;
}

function lowerFirst(s) {
  const t = (s || '').trim();
  return t ? t.charAt(0).toLowerCase() + t.slice(1) : t;
}

function stripTrailingPunct(s) {
  return (s || '').trim().replace(/[.\s]+$/, '');
}

const LEADING_CONNECTOR = /^(because|due to|so that|the reason is|as a result of)\s+/i;

// Builds a root cause statement directly from the case's own 5-Whys answers — never
// from a matched historical example — so the statement is always grounded in what the
// user actually entered for THIS case, with no invented facts.
function synthesizeRootCause(whys) {
  const cleaned = whys.map(stripTrailingPunct).filter(Boolean);
  if (cleaned.length === 0) return '';
  const deepest = cleaned[cleaned.length - 1];
  const proximate = cleaned.length > 1 ? cleaned[0] : '';
  if (proximate && proximate.toLowerCase() !== deepest.toLowerCase()) {
    if (LEADING_CONNECTOR.test(deepest)) {
      // Deepest why already reads as a reason clause ("Due to a lapse in...") — attach
      // it directly with its own connector rather than forcing a second "because".
      return `${capitalize(proximate)}, ${lowerFirst(deepest)}.`;
    }
    return `${capitalize(proximate)}. This occurred because ${lowerFirst(deepest)}.`;
  }
  return `${capitalize(deepest)}.`;
}

// States what the escalation actually was — the client's/QA's own description plus the
// case's identifying context — so the generated write-up explains the incident itself
// before analyzing why it happened, instead of jumping straight to root cause.
function synthesizeEscalationSummary(draft) {
  const desc = stripTrailingPunct(draft.description);
  if (!desc) return '';
  const sentence = capitalize(desc) + '.';
  const details = [];
  if (draft.clientName) details.push(`Client: ${draft.clientName}`);
  if (draft.orderId) details.push(`Order/File: ${draft.orderId}`);
  if (draft.rca && draft.rca.processStepFailed) details.push(`Process step: ${draft.rca.processStepFailed}`);
  if (draft.severity) details.push(`Severity: ${draft.severity}`);
  const detailLine = details.length ? `\n(${details.join(' · ')})` : '';
  return `${sentence}${detailLine}`;
}

// Retrieves the closest-matching historical examples for this case (by token overlap
// across issue type / description / whys) and reuses their real, previously-used
// corrective/preventive actions as a starting template — entirely offline, no API call.
function synthesizeRCACAPA(draft, whys) {
  const queryTokens = tokenize([draft.rca.missReasonCategory, draft.description, ...whys].join(' '));
  const scored = FEWSHOT_LIBRARY
    .map((entry) => ({ entry, score: scoreFewShot(entry, queryTokens) }))
    .sort((a, b) => b.score - a.score);

  const escalationSummary = synthesizeEscalationSummary(draft);
  const rootCause = synthesizeRootCause(whys);
  // Middle whys (between the first, proximate cause, and the last, deepest one) become
  // contributing factors — again, only the user's own words, never fabricated.
  const contributingFactors = whys.length > 2 ? whys.slice(1, -1) : [];

  let correctiveActions = [];
  let preventiveActions = [];
  let matchedOn = null;
  for (const { entry, score } of scored) {
    if (score <= 0) break;
    if (!matchedOn) matchedOn = entry;
    if (!correctiveActions.length && entry.correctiveActions.length) correctiveActions = entry.correctiveActions;
    if (!preventiveActions.length && entry.preventiveActions.length) preventiveActions = entry.preventiveActions;
    if (correctiveActions.length && preventiveActions.length) break;
  }
  if (!correctiveActions.length) {
    correctiveActions = ['Provide coaching to the associate on this specific process step.'];
  }
  if (!preventiveActions.length) {
    preventiveActions = ['Conduct refresher training and add a verification step to prevent recurrence.'];
  }

  const reference = pickReference(draft, whys);

  return { escalationSummary, rootCause, contributingFactors, correctiveActions, preventiveActions, matchedOn, reference };
}

function severityTone(sev) {
  if (sev === 'Critical') return 'red';
  if (sev === 'High') return 'red';
  if (sev === 'Medium') return 'amber';
  return 'muted';
}

function statusTone(status) {
  if (status === 'Closed') return 'green';
  if (status === 'Open') return 'muted';
  return 'amber';
}

function whyChain(rca) {
  const whys = [rca.why1, rca.why2, rca.why3, rca.why4, rca.why5]
    .map((w) => (w || '').trim())
    .filter(Boolean);
  // Fallback for cases saved before the 5-Whys structure existed.
  if (whys.length === 0 && rca.missReasonDetails) whys.push(rca.missReasonDetails);
  return whys;
}

function buildSections(c, allCases) {
  const matches = (c.rca.linkedCaseIds || [])
    .map((id) => allCases.find((x) => x.id === id))
    .filter(Boolean);
  const whys = whyChain(c.rca);
  const whyRows = whys.length
    ? whys.map((w, i) => [`Why ${i + 1}`, w])
    : [['Why 1', '—']];
  return [
    {
      heading: 'Escalation',
      rows: [
        ['Client', c.clientName || '—'],
        ['Order / file ID', c.orderId || '—'],
        ['Category', c.category],
        ['Severity', c.severity],
        ['Date received', formatDate(c.dateReceived)],
        ['Reported by', c.reportedBy || '—'],
        ['Description', c.description || '—'],
      ],
    },
    {
      heading: 'Root cause (5 Whys)',
      rows: [
        ['Process step where it failed', c.rca.processStepFailed],
        ['Person involved', c.rca.involvedPerson || '—'],
        ['Did they understand the mistake?', c.rca.understoodMistake + (c.rca.understoodNotes ? ' — ' + c.rca.understoodNotes : '')],
        ['Root cause category', c.rca.missReasonCategory],
        ...whyRows,
        ['Final root cause', whys[whys.length - 1] || '—'],
        ['Repetitive issue?', c.rca.isRepetitive ? `Yes${matches.length ? ' — linked to ' + matches.map((m) => m.caseNumber).join(', ') : ''}` : 'No prior similar case identified'],
      ],
    },
    {
      heading: 'Immediate action',
      rows: [['What was done right after the error was found', c.immediateAction || '—']],
    },
    {
      heading: 'Corrective & preventive action (CAPA)',
      rows: [
        ['Corrective action (fixes this case)', c.capa.correctiveAction || '—'],
        ['Corrective owner / due', `${c.capa.correctiveOwner || '—'} · ${formatDate(c.capa.correctiveDueDate)}`],
        ['Preventive action (stops recurrence)', c.capa.preventiveAction || '—'],
        ['Preventive owner / due', `${c.capa.preventiveOwner || '—'} · ${formatDate(c.capa.preventiveDueDate)}`],
        ['Applicable standard / reference', c.complianceReference || '—'],
      ],
    },
    {
      heading: 'Verification',
      rows: [
        ['How we will confirm it worked', c.capa.verificationPlan || '—'],
        ['Target date', formatDate(c.capa.verificationDate)],
        ['Verified effective?', c.capa.verified ? 'Yes' : 'Not yet'],
      ],
    },
  ];
}

function Dashboard({ cases, onNew, onOpen, onResetAll }) {
  const [search, setSearch] = useState('');
  const [catFilter, setCatFilter] = useState('All');
  const [statusFilter, setStatusFilter] = useState('All');
  const [repeatOnly, setRepeatOnly] = useState(false);
  const [showReset, setShowReset] = useState(false);

  const filtered = useMemo(() => {
    return cases
      .filter((c) => catFilter === 'All' || c.category === catFilter)
      .filter((c) => statusFilter === 'All' || c.status === statusFilter)
      .filter((c) => !repeatOnly || c.rca.isRepetitive)
      .filter((c) => {
        if (!search.trim()) return true;
        const s = search.toLowerCase();
        return (
          c.clientName.toLowerCase().includes(s) ||
          c.orderId.toLowerCase().includes(s) ||
          c.description.toLowerCase().includes(s) ||
          c.caseNumber.toLowerCase().includes(s)
        );
      })
      .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  }, [cases, catFilter, statusFilter, repeatOnly, search]);

  const stats = useMemo(() => {
    const total = cases.length;
    const open = cases.filter((c) => c.status !== 'Closed').length;
    const repetitive = cases.filter((c) => c.rca.isRepetitive).length;
    const closed = cases.filter((c) => c.status === 'Closed').length;
    return { total, open, repetitive, closed };
  }, [cases]);

  const rootCauseBreakdown = useMemo(() => {
    const counts = {};
    cases.forEach((c) => {
      const k = c.rca.missReasonCategory;
      counts[k] = (counts[k] || 0) + 1;
    });
    const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]);
    const max = entries.length ? entries[0][1] : 1;
    return { entries, max };
  }, [cases]);

  return (
    <div>
      <div className="er-shared-banner">
        <Info size={15} />
        <span>This register is shared with every team leader using this portal — entries logged by anyone will be visible to all.</span>
      </div>

      <div className="er-header-row">
        <div>
          <h1 className="er-serif er-h1">Escalation &amp; CAPA register</h1>
          <p className="er-subtitle">Client escalations for appraisal and order management, with guided root-cause analysis and corrective/preventive action tracking.</p>
        </div>
        <button className="er-btn er-btn-primary" onClick={onNew}>
          <Plus size={16} /> Log new escalation
        </button>
      </div>

      <div className="er-stats-row">
        <div className="er-stat">
          <span className="er-stat-value">{stats.total}</span>
          <span className="er-stat-label">Total logged</span>
        </div>
        <div className="er-stat er-stat-accent-amber">
          <span className="er-stat-value">{stats.open}</span>
          <span className="er-stat-label">Open</span>
        </div>
        <div className="er-stat er-stat-accent-red">
          <span className="er-stat-value">{stats.repetitive}</span>
          <span className="er-stat-label">Flagged repetitive</span>
        </div>
        <div className="er-stat er-stat-accent-green">
          <span className="er-stat-value">{stats.closed}</span>
          <span className="er-stat-label">Closed</span>
        </div>
      </div>

      {rootCauseBreakdown.entries.length > 0 && (
        <div className="er-panel">
          <h2 className="er-panel-title">Root causes logged so far</h2>
          <div className="er-bars">
            {rootCauseBreakdown.entries.map(([label, count]) => (
              <div className="er-bar-row" key={label}>
                <span className="er-bar-label">{label}</span>
                <div className="er-bar-track">
                  <div className="er-bar-fill" style={{ width: `${Math.max(6, (count / rootCauseBreakdown.max) * 100)}%` }} />
                </div>
                <span className="er-bar-count">{count}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      <div className="er-filters-row">
        <div className="er-search">
          <Search size={15} />
          <input
            placeholder="Search client, order ID, case number, description…"
            value={search}
            onChange={(e) => setSearch(e.target.value)}
          />
        </div>
        <Select options={['All', ...CATEGORIES]} value={catFilter} onChange={(e) => setCatFilter(e.target.value)} aria-label="Filter by category" />
        <Select options={['All', ...STATUSES]} value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)} aria-label="Filter by status" />
        <label className="er-checkbox-inline">
          <input type="checkbox" checked={repeatOnly} onChange={(e) => setRepeatOnly(e.target.checked)} />
          Repetitive only
        </label>
      </div>

      {cases.length === 0 ? (
        <div className="er-empty">
          <ClipboardList size={26} />
          <p className="er-serif er-empty-title">No escalations logged yet</p>
          <p className="er-empty-body">Log the first client escalation to start building the register and root-cause history.</p>
          <button className="er-btn er-btn-primary" onClick={onNew}><Plus size={16} /> Log new escalation</button>
        </div>
      ) : (
        <div className="er-table-wrap">
          <table className="er-table">
            <thead>
              <tr>
                <th>Case</th>
                <th>Client</th>
                <th>Category</th>
                <th>Severity</th>
                <th>Status</th>
                <th>Repeat</th>
                <th>Received</th>
              </tr>
            </thead>
            <tbody>
              {filtered.map((c) => (
                <tr key={c.id} onClick={() => onOpen(c.id)} tabIndex={0}
                    onKeyDown={(e) => { if (e.key === 'Enter') onOpen(c.id); }}>
                  <td className="er-mono">{c.caseNumber}</td>
                  <td>{c.clientName || '—'}</td>
                  <td>{c.category}</td>
                  <td><Tag tone={severityTone(c.severity)}>{c.severity}</Tag></td>
                  <td><Tag tone={statusTone(c.status)}>{c.status}</Tag></td>
                  <td>{c.rca.isRepetitive ? <Tag tone="red">Repeat</Tag> : '—'}</td>
                  <td>{formatDate(c.dateReceived)}</td>
                </tr>
              ))}
            </tbody>
          </table>
          {filtered.length === 0 && <p className="er-empty-filter">No cases match these filters.</p>}
        </div>
      )}

      {cases.length > 0 && (
        <button className="er-link-muted er-reset-link" onClick={() => setShowReset(true)}>Clear all register data</button>
      )}

      {showReset && (
        <ConfirmModal
          title="Clear all register data?"
          body="This permanently deletes every logged escalation for all team leaders sharing this register. This cannot be undone."
          confirmLabel="Clear everything"
          danger
          onCancel={() => setShowReset(false)}
          onConfirm={() => { setShowReset(false); onResetAll(); }}
        />
      )}
    </div>
  );
}

const WHY_PROMPTS = [
  'Why did this happen? (Why 1)',
  'Why did that happen? (Why 2)',
  'Why did that happen? (Why 3)',
  'Why did that happen? (Why 4)',
  'Why did that happen? (Why 5)',
];
const WHY_KEYS = ['why1', 'why2', 'why3', 'why4', 'why5'];

function StepUnderstandingError({ draft, setRCA, onAutoGenerate, aiLoading, aiError }) {
  // Show Why 1, plus each next Why only once the one before it has been filled in —
  // keeps the form short for simple cases while still allowing a full 5-level drill-down.
  const visibleWhys = WHY_KEYS.reduce((n, key, i) => (i === 0 || draft.rca[WHY_KEYS[i - 1]].trim() ? i + 1 : n), 1);
  const canAutoGenerate = draft.rca.why1.trim().length > 0;

  return (
    <div className="er-step-grid">
      <Field label="Which process step failed?" required>
        <Select options={PROCESS_STEPS} value={draft.rca.processStepFailed} onChange={(e) => setRCA('processStepFailed', e.target.value)} />

      <Field label="Who was involved?" required hint="The team member (or vendor/appraiser) whose step this was.">

      </Field>
      <Field label="Did the person who made the error understand where they went wrong?" required>
        <div className="er-radio-row">
          {UNDERSTOOD_OPTIONS.map((opt) => (

              <input type="radio" name="understood" value={opt} checked={draft.rca.understoodMistake === opt} onChange={() => setRCA('understoodMistake', opt)} />

      </Field>
      <Field label="Root cause category" required hint="Used for the register-wide root-cause breakdown on the dashboard.">
        <Select options={ROOT_CAUSE_CATEGORIES} value={draft.rca.missReasonCategory} onChange={(e) => setRCA('missReasonCategory', e.target.value)} />
      </Field>

      <div className="er-field">
        <span className="er-field-label">5 Whys — drill down to the real root cause</span>
        <span className="er-field-hint">Start with what happened, then keep asking "why" until you reach something a corrective/preventive action can actually fix. Most cases only need 2–5 whys.</span>
      </div>
      {WHY_KEYS.slice(0, visibleWhys).map((key, i) => (
        <Field key={key} label={WHY_PROMPTS[i]} required={i === 0}>

            rows={2}
            value={draft.rca[key]}

        <div className="er-ai-block">

            <h4 className="er-review-heading"><Sparkles size={14} /> Auto-generate RCA &amp; CAPA</h4>

              {aiLoading ? <><Loader2 size={14} className="er-spin" /> Generating…</> : <><Sparkles size={14} /> Generate</>}
            </button>
          </div>
          <p className="er-ai-hint">Drafts the root cause, corrective action and preventive action from the whys above, matched to your team's own RCA/CAPA style. It fills in the CAPA step and the review note — everything stays editable before you save.</p>
          {aiError && <p className="er-ai-error">{aiError}</p>}

            <div className="er-panel er-narrative-panel" style={{ marginTop: 10 }}>
              <p className="er-narrative-text">{draft.aiNarrative}</p>

function StepRepetitionCheck({ draft, setRCA, cases }) {
  const matches = useMemo(() => findMatches(draft, cases), [draft.description, draft.category, draft.rca.processStepFailed, cases]);

  const toggleLink = (id) => {
    const linked = draft.rca.linkedCaseIds || [];
    const next = linked.includes(id) ? linked.filter((x) => x !== id) : [...linked, id];
    setRCA('linkedCaseIds', next);
    if (next.length > 0) setRCA('isRepetitive', true);
  };

  return (
    <div className="er-step-grid">
      <div className="er-match-panel">
        <h3 className="er-match-heading"><Link2 size={15} /> Similar past cases</h3>
        {matches.length === 0 ? (
          <p className="er-match-empty">No similar past cases were found automatically, based on description, category and process step. You can still mark this as repetitive manually below.</p>
        ) : (
          <ul className="er-match-list">
            {matches.map((m) => (
              <li key={m.caseObj.id} className="er-match-item">
                <label className="er-match-check">
                  <input
                    type="checkbox"
                    checked={(draft.rca.linkedCaseIds || []).includes(m.caseObj.id)}
                    onChange={() => toggleLink(m.caseObj.id)}
                  />
                  <div>
                    <div className="er-match-top">
                      <span className="er-mono">{m.caseObj.caseNumber}</span>
                      <span className="er-match-score">{Math.round(m.score * 100)}% similar</span>
                      <span className="er-match-date">{formatDate(m.caseObj.dateReceived)}</span>
                    </div>
                    <div className="er-match-desc">{m.caseObj.description}</div>
                  </div>
                </label>
              </li>
            ))}
          </ul>
        )}
      </div>
      <Field label="Is this a repetitive issue?" required hint="Confirm or override the automatic suggestion above.">
        <div className="er-radio-row">
          <label className={`er-radio-pill ${draft.rca.isRepetitive ? 'er-radio-pill-active' : ''}`}>
            <input type="radio" name="repetitive" checked={draft.rca.isRepetitive === true} onChange={() => setRCA('isRepetitive', true)} />
            Yes, repetitive
          </label>
          <label className={`er-radio-pill ${!draft.rca.isRepetitive ? 'er-radio-pill-active' : ''}`}>
            <input type="radio" name="repetitive" checked={draft.rca.isRepetitive === false} onChange={() => { setRCA('isRepetitive', false); setRCA('linkedCaseIds', []); }} />
            No, first occurrence
          </label>
        </div>
      </Field>
    </div>
  );
}

          </button>

        <p className="er-ai-hint">Turns the whys into a client-file-ready narrative you can edit before saving. Regenerating also refreshes the corrective/preventive action fields above.</p>
        {aiError && <p className="er-ai-error">{aiError}</p>}
        <TextArea rows={6} value={draft.aiNarrative} onChange={(e) => setTop('aiNarrative', e.target.value)} placeholder="Click “Regenerate”, or write your own summary here." />
      </div>

      <Field label="Additional notes" hint="Anything else worth keeping on file.">
        <TextArea rows={2} value={draft.additionalNotes} onChange={(e) => setTop('additionalNotes', e.target.value)} />
      </Field>
    </div>
  );
}

/* Wizard shell                                                           */
/* ---------------------------------------------------------------------- */

function canProceed(step, draft) {
  switch (step) {
    case 0: return draft.clientName.trim() && draft.orderId.trim() && draft.description.trim();
    case 1: return draft.rca.involvedPerson.trim() && draft.rca.why1.trim();
    case 3: return draft.immediateAction.trim();
    case 4: return draft.capa.correctiveAction.trim() && draft.capa.preventiveAction.trim();
    case 5: return draft.capa.verificationPlan.trim();
    default: return true;
  }
}

function Wizard({ draft, setDraft, cases, currentStep, setCurrentStep, onSave, onCancel, isEditing }) {
  const [aiLoading, setAiLoading] = useState(false);
  const [aiError, setAiError] = useState('');

  const setTop = useCallback((key, value) => setDraft((prev) => ({ ...prev, [key]: value })), [setDraft]);
  const setRCA = useCallback((key, value) => setDraft((prev) => ({ ...prev, rca: { ...prev.rca, [key]: value } })), [setDraft]);
  const setCAPA = useCallback((key, value) => setDraft((prev) => ({ ...prev, capa: { ...prev.capa, [key]: value } })), [setDraft]);

  const autoGenerateRCACAPA = () => {
    const whys = whyChain(draft.rca);
    if (whys.length === 0) {
      setAiError('Add at least one "why" before auto-generating.');
      return;
    }
    setAiError('');
    // Synthesized locally from the team's real historical RCA/CAPA log — this page is
    // static (no server), so generation runs entirely in the browser rather than
    // calling an external AI API, which a plain hosted page has no way to reach.
    const parsed = synthesizeRCACAPA(draft, whys);
    setDraft((prev) => ({
      ...prev,
      capa: {
        ...prev.capa,
        correctiveAction: parsed.correctiveActions.join('\n') || prev.capa.correctiveAction,
        preventiveAction: parsed.preventiveActions.join('\n') || prev.capa.preventiveAction,
      },
      aiNarrative: composeNarrative(parsed),
      complianceReference: parsed.reference ? `${parsed.reference.title} — ${parsed.reference.citation}` : prev.complianceReference,
    }));
  };

  const stepOk = canProceed(currentStep, draft);
  const isLast = currentStep === WIZARD_STEPS.length - 1;

  return (
    <div className="er-wizard">
      <div className="er-wizard-header">
        <button className="er-link-muted er-back" onClick={onCancel}><ArrowLeft size={15} /> Back to register</button>
        <h2 className="er-serif er-h2">{isEditing ? `Editing ${draft.caseNumber}` : 'Log new escalation'}</h2>
      </div>

      <div className="er-wizard-body">
        <ol className="er-stepper">
          {WIZARD_STEPS.map((s, i) => (
            <li key={s.title}>
              <button
                className={`er-step-btn ${i === currentStep ? 'er-step-btn-active' : ''} ${i < currentStep ? 'er-step-btn-done' : ''}`}
                onClick={() => setCurrentStep(i)}
              >
                <span className="er-step-num">{i < currentStep ? <Check size={12} /> : i + 1}</span>
                {s.title}
              </button>
            </li>
          ))}
        </ol>

        <div className="er-wizard-content">
          {currentStep === 0 && <StepEscalationDetails draft={draft} setTop={setTop} />}
          {currentStep === 1 && (
            <StepUnderstandingError draft={draft} setRCA={setRCA} onAutoGenerate={autoGenerateRCACAPA} aiLoading={aiLoading} aiError={aiError} />
          )}
          {currentStep === 2 && <StepRepetitionCheck draft={draft} setRCA={setRCA} cases={cases} />}
          {currentStep === 3 && <StepImmediateAction draft={draft} setTop={setTop} />}
          {currentStep === 4 && (
            <StepCAPA draft={draft} setCAPA={setCAPA} onAutoGenerate={autoGenerateRCACAPA} aiLoading={aiLoading} aiError={aiError} />
          )}
          {currentStep === 5 && <StepVerification draft={draft} setCAPA={setCAPA} />}
          {currentStep === 6 && (
            <StepReview draft={draft} setTop={setTop} cases={cases} aiLoading={aiLoading} aiError={aiError} onGenerateAI={autoGenerateRCACAPA} />
          )}

          <div className="er-wizard-nav">
            <button className="er-btn er-btn-ghost" disabled={currentStep === 0} onClick={() => setCurrentStep((s) => Math.max(0, s - 1))}>
              <ArrowLeft size={15} /> Back
            </button>
            {!isLast ? (
              <button className="er-btn er-btn-primary" disabled={!stepOk} onClick={() => setCurrentStep((s) => Math.min(WIZARD_STEPS.length - 1, s + 1))}>
                Next <ArrowRight size={15} />
              </button>
            ) : (
              <button className="er-btn er-btn-primary" onClick={onSave}>
                <Check size={15} /> Save case
              </button>
            )}
          </div>
          {!stepOk && !isLast && <p className="er-step-warning">Fill in the required fields (marked *) to continue.</p>}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [status, setStatus] = useState('loading'); // loading | ready | error
  const [cases, setCases] = useState([]);
  const [view, setView] = useState('dashboard'); // dashboard | wizard | detail
  const [activeId, setActiveId] = useState(null);
  const [draft, setDraft] = useState(null);
  const [currentStep, setCurrentStep] = useState(0);
  const [isEditingExisting, setIsEditingExisting] = useState(false);

  const load = useCallback(async () => {
    setStatus('loading');
    try {
      let parsed = [];
      try {
        const raw = window.localStorage.getItem(STORAGE_KEY);
        parsed = raw ? JSON.parse(raw) : [];
      } catch (e) {
        parsed = [];
      }
      setCases(Array.isArray(parsed) ? parsed : []);
      setStatus('ready');
    } catch (e) {
      setStatus('error');
    }
  }, []);

  useEffect(() => { load(); }, [load]);

  const persist = async (next) => {
    setCases(next);
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
    } catch (e) {
      // Best-effort: keep local state even if the write failed, and surface nothing intrusive.
    }
  };

  const openNew = () => {
    setDraft(blankCase(cases.length + 1));
    setIsEditingExisting(false);
    setCurrentStep(0);
    setView('wizard');
  };

  const openEdit = (id) => {
    const found = cases.find((c) => c.id === id);
    if (!found) return;
    setDraft(JSON.parse(JSON.stringify(found)));
    setIsEditingExisting(true);
    setCurrentStep(0);
    setView('wizard');
  };

  const openDetail = (id) => {
    setActiveId(id);
    setView('detail');
  };

  const saveDraft = () => {
    const now = new Date().toISOString();
    const finished = { ...draft, updatedAt: now };
    const exists = cases.some((c) => c.id === finished.id);
    const next = exists ? cases.map((c) => (c.id === finished.id ? finished : c)) : [...cases, finished];
    persist(next);
    setActiveId(finished.id);
    setView('detail');
  };

  const changeStatus = (id, newStatus) => {
    const next = cases.map((c) => (c.id === id ? { ...c, status: newStatus, updatedAt: new Date().toISOString() } : c));
    persist(next);
  };

  const deleteCase = (id) => {
    const next = cases.filter((c) => c.id !== id);
    persist(next);
    setView('dashboard');
  };

  const resetAll = () => {
    persist([]);
    setView('dashboard');
  };

        .er-review-heading { font-size: 12.5px; font-weight: 600; text-transform: none; color: var(--teal-dark); margin: 0 0 8px; display: flex; align-items: center; gap: 6px; }
        .er-review-rows { display: grid; grid-template-columns: 220px 1fr; gap: 6px 14px; margin: 0; font-size: 13.5px; }
        .er-review-rows dt { color: var(--muted); }
        .er-review-rows dd { margin: 0; }

        .er-ai-block { border: 1px solid var(--line); background: rgba(47, 93, 98, 0.03); padding: 14px 16px; }
        .er-ai-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 4px; }
        .er-ai-hint { font-size: 12px; color: var(--muted); margin: 0 0 10px; }
        .er-ai-error { font-size: 12.5px; color: var(--red); margin: 0 0 8px; }
        .er-spin { animation: er-spin 0.9s linear infinite; }
        @keyframes er-spin { to { transform: rotate(360deg); } }

        .er-detail-top { max-width: 980px; margin: 0 auto; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
        .er-detail-case-no { color: var(--muted); font-size: 12.5px; }
        .er-detail-tags { display: flex; gap: 6px; margin-top: 8px; }
        .er-detail-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .er-detail-meta { max-width: 980px; margin: 10px auto 20px; font-size: 12.5px; color: var(--muted); }
        .er-narrative-panel { border-left: 3px solid var(--teal); }
        .er-narrative-text { white-space: pre-wrap; font-size: 14px; margin: 0; }

        .er-loading-wrap, .er-error-wrap { max-width: 980px; margin: 60px auto; text-align: center; color: var(--muted); }

        @media (max-width: 760px) {
          .er-stats-row { grid-template-columns: repeat(2, 1fr); }
          .er-wizard-body { grid-template-columns: 1fr; }
          .er-stepper { flex-direction: row; flex-wrap: wrap; position: static; }
          .er-step-btn span:last-child { display: none; }
          .er-step-btn { padding: 6px; }
          .er-two-col { grid-template-columns: 1fr; }
          .er-review-rows { grid-template-columns: 1fr; }
          .er-bar-row { grid-template-columns: 110px 1fr 24px; }
        }
      `}</style>

      <div className="er-max">
        {status === 'loading' && (
          <div className="er-loading-wrap"><Loader2 size={20} className="er-spin" /><p>Loading register…</p></div>
        )}

        {status === 'error' && (
          <div className="er-error-wrap">
            <p>Couldn't load the register.</p>
            <button className="er-btn er-btn-primary" onClick={load}><RefreshCw size={14} /> Retry</button>
          </div>
        )}

        {status === 'ready' && view === 'dashboard' && (
          <Dashboard cases={cases} onNew={openNew} onOpen={openDetail} onResetAll={resetAll} />
        )}

        {status === 'ready' && view === 'wizard' && draft && (
          <Wizard
            draft={draft}
            setDraft={setDraft}
            cases={cases}
            currentStep={currentStep}
            setCurrentStep={setCurrentStep}
            onSave={saveDraft}
            onCancel={() => setView(isEditingExisting ? 'detail' : 'dashboard')}
            isEditing={isEditingExisting}
          />
        )}

        {status === 'ready' && view === 'detail' && activeCase && (
          <CaseDetail
            caseObj={activeCase}
            cases={cases}
            onBack={() => setView('dashboard')}
            onEdit={() => openEdit(activeCase.id)}
            onDelete={() => deleteCase(activeCase.id)}
            onChangeStatus={(s) => changeStatus(activeCase.id, s)}
          />
        )}
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script>
  window.addEventListener("error", function (e) {
    if (!document.getElementById("root").hasChildNodes()) {
      document.getElementById("boot-error").style.display = "block";
    }
  });

  (function () {
    try {
      var source = document.getElementById("app-source").textContent;
      // Force the classic JSX runtime explicitly. Newer builds of
      // @babel/standalone default to the "automatic" runtime, which emits
      // an `import` statement that a plain (non-module) <script> cannot
      // execute and silently breaks the whole app.
      var compiled = Babel.transform(source, {
        presets: [["react", { runtime: "classic" }]],
      }).code;
      var script = document.createElement("script");
      script.text = compiled;
      document.body.appendChild(script);
    } catch (e) {
      console.error("App failed to compile/run:", e);
      document.getElementById("boot-error").style.display = "block";
    }
  })();
</script>
</body>
</html>
